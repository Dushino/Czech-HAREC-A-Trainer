<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK-TRAINER — kartičky pro českou zkoušku HAREC A</title>
<meta name="theme-color" content="#eee8d9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12181a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OK-Trainer">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    /* --- chassis / panel / text: adaptivní podle motivu zařízení --- */
    --chassis:#12181a;
    --panel:#1b2426;
    --panel-2:#212c2e;
    --border:#2a3436;
    --text:#eae6d9;
    --text-muted:#8b9a95;
    --panel-accent:#ffb020;
    --panel-accent-dim:#8a6a2c;
    --green-ui:#6fe3a0;
    --green-dim-ui:#2f5c48;
    --red-ui:#e2543a;
    --red-dim-ui:#6b2f26;

    /* --- LCD displej kartičky: vždy tmavý --- */
    --lcd:#0c1a17;
    --lcd-border:#324442;
    --lcd-text:#eae6d9;
    --lcd-muted:#8b9a95;
    --amber:#ffb020;
    --green:#6fe3a0;
    --red:#e2543a;

    --mono: ui-monospace, Menlo, Consolas, "Cascadia Code", "SF Mono", "Courier New", monospace;
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{
      --chassis:#eee8d9;
      --panel:#ffffff;
      --panel-2:#efe8d6;
      --border:#d9d2bd;
      --text:#2b2a25;
      --text-muted:#6b6558;
      --panel-accent:#a85d00;
      --panel-accent-dim:#d9b27a;
      --green-ui:#1f8a5c;
      --green-dim-ui:#8fc7ac;
      --red-ui:#c23b26;
      --red-dim-ui:#e3a89a;
      --lcd:#ffffff;
      --lcd-border:#d9d2bd;
      --lcd-text:#2b2a25;
      --lcd-muted:#948c78;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--chassis);
    color:var(--text);
    font-family:var(--sans);
    font-feature-settings: "zero" 1, "ss01" 1;
    min-height:100vh;
    padding:24px 16px 60px;
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:640px;}
  header{margin-bottom:18px;text-align:center;}
  .callsign{
    font-family:var(--serif);
    font-size:26px;
    letter-spacing:2px;
    color:var(--panel-accent);
    margin:0 0 4px;
  }
  .sub{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:1px;
    text-transform:uppercase;
  }
  nav.bandswitch{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin:20px 0 10px;
    background:var(--panel);
    padding:6px;
    border-radius:10px;
    border:1px solid var(--border);
  }
  nav.bandswitch button{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.5px;
    padding:10px 4px;
    background:transparent;
    color:var(--text-muted);
    border:1px solid transparent;
    border-radius:6px;
    cursor:pointer;
  }
  nav.bandswitch button.active{
    background:var(--panel-2);
    color:var(--panel-accent);
    border-color:var(--panel-accent-dim);
  }
  .subgroupbar{
    margin-bottom:14px;
    display:none;
  }
  .subgroupbar.visible{display:block;}
  .subgroupbar select{
    width:100%;
    font-family:var(--mono);
    font-size:13px;
    padding:10px 12px;
    background:var(--panel);
    color:var(--panel-accent);
    border:1px solid var(--border);
    border-radius:8px;
    appearance:none;
    -webkit-appearance:none;
  }
  .subgroupbar{position:relative;}
  .subgroupbar::after{
    content:"▾";
    position:absolute;
    right:16px;
    top:12px;
    color:var(--text-muted);
    font-size:12px;
    pointer-events:none;
  }
  .statbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:16px;
  }
  .counts{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    display:flex;
    gap:14px;
  }
  .counts b{color:var(--text);font-weight:600;}
  .counts .ok{color:var(--green-ui);}
  .counts .bad{color:var(--red-ui);}
  .smeter{width:150px;height:60px;flex-shrink:0;}
  #smeter path{stroke:var(--border);}
  #smeter text{fill:var(--text-muted);}
  #smeter text.warn{fill:var(--red-ui);}
  .card{
    background:var(--lcd);
    border:2px solid var(--lcd-border);
    border-radius:12px;
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px 24px;
    cursor:pointer;
    user-select:none;
    position:relative;
  }
  .card .tag{
    position:absolute;
    top:12px;
    left:16px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:1px;
    color:var(--lcd-muted);
    text-transform:uppercase;
  }
  .card .hint{
    position:absolute;
    bottom:12px;
    right:16px;
    font-family:var(--mono);
    font-size:10px;
    color:var(--lcd-muted);
  }
  .card .face{
    font-family:var(--serif);
    font-size:20px;
    line-height:1.5;
    color:var(--lcd-text);
  }
  .card.flipped .face{
    font-family:var(--mono);
    font-size:24px;
    color:var(--panel-accent);
    font-weight:600;
  }
  .card.done{
    color:var(--green-ui);
  }
  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
  }
  .controls button{
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    padding:14px 10px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid;
  }
  #btnBad{
    background:transparent;
    color:var(--red-ui);
    border-color:var(--red-dim-ui);
  }
  #btnBad:hover{background:rgba(226,84,58,0.1);}
  #btnGood{
    background:transparent;
    color:var(--green-ui);
    border-color:var(--green-dim-ui);
  }
  #btnGood:hover{background:rgba(111,227,160,0.1);}
  .controls button:disabled{opacity:0.35;cursor:default;}
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
    flex-wrap:wrap;
    gap:10px;
  }
  .toolbar label{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .toolbar button.link{
    background:none;
    border:none;
    color:var(--text-muted);
    font-family:var(--mono);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .toolbar button.link:hover{color:var(--panel-accent);}
  .keys{
    margin-top:22px;
    text-align:center;
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-muted);
  }
  .keys kbd{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:4px;
    padding:1px 6px;
    color:var(--text);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="callsign">OK-TRAINER</p>
    <p class="sub">kartičky pro zkoušku HAREC · třída A</p>
  </header>

  <nav class="bandswitch" id="bandswitch">
    <button data-cat="qkody">Q-kódy</button>
    <button data-cat="zkratky">Zkratky</button>
    <button data-cat="prefixy">Prefixy</button>
    <button data-cat="pasma">Pásma</button>
  </nav>

  <div class="subgroupbar" id="subgroupbar">
    <select id="subgroupSelect"></select>
  </div>

  <div class="statbar">
    <div class="counts">
      <span>umím <b class="ok" id="cntGood">0</b></span>
      <span>neumím <b class="bad" id="cntBad">0</b></span>
      <span>zbývá <b id="cntLeft">0</b></span>
    </div>
    <svg class="smeter" viewBox="0 0 150 60" id="smeter">
      <path d="M 10 55 A 65 65 0 0 1 140 55" fill="none" stroke="#33403f" stroke-width="3"/>
      <g id="smeterTicks"></g>
      <text x="12" y="52" fill="#8b9a95" font-family="ui-monospace,monospace" font-size="8">S1</text>
      <text x="70" y="14" fill="#8b9a95" font-family="ui-monospace,monospace" font-size="8" text-anchor="middle">S9</text>
      <text x="132" y="52" class="warn" font-family="ui-monospace,monospace" font-size="8" text-anchor="end">+40</text>
      <line id="needle" x1="75" y1="55" x2="75" y2="12" stroke="#ffb020" stroke-width="2" stroke-linecap="round"/>
      <circle cx="75" cy="55" r="3.5" fill="#ffb020"/>
    </svg>
  </div>

  <div class="card" id="card">
    <span class="tag" id="cardTag">Q-KÓDY</span>
    <div class="face" id="cardFace">načítám…</div>
    <span class="hint" id="cardHint">klikni pro otočení</span>
  </div>

  <div class="controls">
    <button id="btnBad" disabled>✗ Neznal jsem</button>
    <button id="btnGood" disabled>✓ Znal jsem</button>
  </div>

  <div class="toolbar">
    <label><input type="checkbox" id="onlyHard"> jen obtížné</label>
    <button class="link" id="btnShuffle">zamíchat znovu</button>
    <button class="link" id="btnReset">resetovat postup výběru</button>
  </div>

  <p class="keys">
    <kbd>mezerník</kbd> otočit &nbsp; <kbd>←</kbd> neznal jsem &nbsp; <kbd>→</kbd> znal jsem
  </p>

  <footer style="margin-top:28px;text-align:center;">
    <a href="https://github.com/Dushino/Czech-HAREC-A-Trainer"
       target="_blank" rel="noopener"
       style="font-family:var(--mono);font-size:11px;color:var(--text-muted);text-decoration:none;">
      github.com/Dushino/Czech-HAREC-A-Trainer
    </a>
  </footer>
</div>

// pořadí podskupin v rozbalovacím seznamu
const GROUP_ORDER = {
qkody: ["Rušení a čitelnost signálu","Výkon a rychlost","Řízení provozu (start, stop, čekání, volání)","Spojení, potvrzení a poloha"],
zkratky: ["Pozdravy","Zdvořilost a přání","Řízení provozu spojení","Report, potvrzení a rušení","Vybavení a obvody stanice","Modulace a druhy provozu","Pásma, klíčování a rušení kmitočtu","Osoby a vztahy","Počasí","Zájmena, spojky a základní slova","Směry, pohyb a akce","Jednotky a elektrotechnika","Organizace a radioamatérský svět","Časové a obecné pojmy","Zbývající zkratky"],
prefixy: ["Sousedé ČR","Skandinávie a sever. Atlantik","Britské ostrovy","Pyrenejský poloostrov","Balkán","Bývalý SSSR / vých. Evropa","Ostatní záp./již. Evropa","Amerika","Asie a Pacifik","Jižní Afrika"],
pasma: ["160 m (1,8 MHz)","80 m (3,5 MHz)","40 m (7 MHz)","30 m (10 MHz, WARC)","20 m (14 MHz)","17 m (18 MHz, WARC)","15 m (21 MHz)","12 m (24 MHz, WARC)","10 m (28 MHz)","6 m (50–52 MHz)","2 m (144–146 MHz)","70 cm (430–440 MHz)","Obecná pravidla"]
};
const ALL_LABEL = {qkody:"Všechny Q-kódy", zkratky:"Všechny zkratky", prefixy:"Všechny regiony", pasma:"Všechna pásma"};

const CAT_LABELS = {qkody:"Q-KÓDY", zkratky:"ZKRATKY", prefixy:"PREFIXY", pasma:"PÁSMA"};
const STORAGE_KEY = "hamtrainer_v2";

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}

let progress = loadProgress();
let state = {
  cat: localStorage.getItem("hamtrainer_lastcat") || "qkody",
  group: "__all__",
  deck: [],
  pos: 0,
  flipped: false,
  sessionGood: 0,
  sessionBad: 0
};

function cardKey(cat, idx){ return cat + ":" + idx; }
function getBox(cat, idx){
  const k = cardKey(cat, idx);
  return progress[k] || 1;
}
function setBox(cat, idx, box){
  progress[cardKey(cat, idx)] = Math.max(1, Math.min(5, box));
  saveProgress(progress);
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// Sestaví pořadí kartiček tak, aby se stejná kartička nikdy neobjevila
// dvakrát za sebou, ale zachovalo se procentuální zastoupení dané vahou
// (Leitnerův box). Jde o standardní řešení úlohy "rozlož multimnožinu tak,
// aby žádné dva sousední prvky nebyly stejné" (greedy podle zbývajícího počtu).
function buildNoAdjacentSequence(countsObj){
  let items = Object.keys(countsObj).map(k => ({idx: Number(k), count: countsObj[k]}));
  const total = items.reduce((a,b) => a + b.count, 0);
  let result = [];
  let last = null;
  while(result.length < total){
    let candidates = items.filter(i => i.count > 0 && i.idx !== last);
    if(candidates.length === 0){
      // Nevyhnutelné opakování (např. zbyla jen jedna kartička) — povolíme ho.
      candidates = items.filter(i => i.count > 0);
    }
    const maxCount = Math.max(...candidates.map(c => c.count));
    const top = candidates.filter(c => c.count === maxCount);
    const choice = top[Math.floor(Math.random() * top.length)];
    result.push(choice.idx);
    choice.count--;
    last = choice.idx;
  }
  return result;
}

function hasGroups(cat){
  return !!GROUP_ORDER[cat];
}

function renderSubgroupBar(){
  const bar = document.getElementById("subgroupbar");
  const sel = document.getElementById("subgroupSelect");
  if(!hasGroups(state.cat)){
    bar.classList.remove("visible");
    return;
  }
  bar.classList.add("visible");
  const groups = GROUP_ORDER[state.cat];
  const label = ALL_LABEL[state.cat] || "Vše";
  let html = '<option value="__all__">' + label + '</option>';
  groups.forEach(g => {
    html += '<option value="' + g.replace(/"/g,'&quot;') + '">' + g + '</option>';
  });
  sel.innerHTML = html;
  sel.value = state.group;
}

function buildDeck(){
  const items = DATA[state.cat];
  const onlyHard = document.getElementById("onlyHard").checked;
  let indices = items.map((_, i) => i);
  if(hasGroups(state.cat) && state.group !== "__all__"){
    indices = indices.filter(i => items[i][2] === state.group);
  }
  if(onlyHard){
    const filteredByHard = indices.filter(i => getBox(state.cat, i) <= 2);
    if(filteredByHard.length > 0) indices = filteredByHard;
  }
  const counts = {};
  indices.forEach(i => {
    const box = getBox(state.cat, i);
    counts[i] = Math.max(1, 6 - box);
  });
  state.deck = buildNoAdjacentSequence(counts);
  state.pos = 0;
  state.flipped = false;
}

function currentItem(){
  if(state.pos >= state.deck.length) return null;
  const idx = state.deck[state.pos];
  return {idx, front: DATA[state.cat][idx][0], back: DATA[state.cat][idx][1]};
}

function renderCard(){
  const card = document.getElementById("card");
  const face = document.getElementById("cardFace");
  const hint = document.getElementById("cardHint");
  const tag = document.getElementById("cardTag");
  const groupLabel = hasGroups(state.cat) && state.group !== "__all__" ? " · " + state.group : "";
  tag.textContent = CAT_LABELS[state.cat] + groupLabel;
  const item = currentItem();
  const btnGood = document.getElementById("btnGood");
  const btnBad = document.getElementById("btnBad");

  if(!item){
    card.classList.remove("flipped");
    card.classList.add("done");
    face.textContent = "Výběr procvičen ✓ — zamíchej znovu";
    hint.textContent = "";
    btnGood.disabled = true;
    btnBad.disabled = true;
    updateStats();
    return;
  }
  card.classList.remove("done");
  if(state.flipped){
    card.classList.add("flipped");
    face.textContent = item.back;
    hint.textContent = "klikni pro otočení zpět";
    btnGood.disabled = false;
    btnBad.disabled = false;
  }else{
    card.classList.remove("flipped");
    face.textContent = item.front;
    hint.textContent = "klikni pro otočení";
    btnGood.disabled = true;
    btnBad.disabled = true;
  }
  updateStats();
}

function updateStats(){
  document.getElementById("cntGood").textContent = state.sessionGood;
  document.getElementById("cntBad").textContent = state.sessionBad;
  document.getElementById("cntLeft").textContent = Math.max(0, state.deck.length - state.pos);
  updateMeter();
}

function cssVar(name, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}

function updateMeter(){
  const total = state.sessionGood + state.sessionBad;
  const ratio = total === 0 ? 0.15 : state.sessionGood / total;
  const angle = -90 + ratio * 180;
  const needle = document.getElementById("needle");
  needle.setAttribute("transform", "rotate(" + angle + " 75 55)");
  needle.setAttribute("stroke", ratio > 0.7 ? cssVar('--green-ui','#6fe3a0') : (ratio > 0.4 ? cssVar('--panel-accent','#ffb020') : cssVar('--red-ui','#e2543a')));
}

function drawMeterTicks(){
  const g = document.getElementById("smeterTicks");
  const ticks = 9;
  let html = "";
  for(let i=0;i<=ticks;i++){
    const t = i/ticks;
    const ang = (-90 + t*180) * Math.PI/180;
    const cx=75, cy=55, rOuter=32, rInner=27;
    const x1 = cx + rInner*Math.sin(ang), y1 = cy - rInner*Math.cos(ang);
    const x2 = cx + rOuter*Math.sin(ang), y2 = cy - rOuter*Math.cos(ang);
    const color = t > 0.75 ? cssVar('--red-ui','#e2543a') : cssVar('--border','#33403f');
    html += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="1.5"/>';
  }
  g.innerHTML = html;
}

function flip(){
  if(!currentItem()) return;
  state.flipped = !state.flipped;
  renderCard();
}

function grade(good){
  const item = currentItem();
  if(!item) return;
  const box = getBox(state.cat, item.idx);
  setBox(state.cat, item.idx, good ? box+1 : 1);
  if(good) state.sessionGood++; else state.sessionBad++;
  state.pos++;
  state.flipped = false;
  renderCard();
}

function setCategory(cat){
  state.cat = cat;
  state.group = "__all__";
  localStorage.setItem("hamtrainer_lastcat", cat);
  document.querySelectorAll("#bandswitch button").forEach(b => {
    b.classList.toggle("active", b.dataset.cat === cat);
  });
  state.sessionGood = 0;
  state.sessionBad = 0;
  renderSubgroupBar();
  buildDeck();
  renderCard();
}

function setGroup(group){
  state.group = group;
  state.sessionGood = 0;
  state.sessionBad = 0;
  buildDeck();
  renderCard();
}

document.getElementById("bandswitch").addEventListener("click", e => {
  const btn = e.target.closest("button[data-cat]");
  if(btn) setCategory(btn.dataset.cat);
});
document.getElementById("subgroupSelect").addEventListener("change", e => {
  setGroup(e.target.value);
});
document.getElementById("card").addEventListener("click", flip);
document.getElementById("btnGood").addEventListener("click", () => grade(true));
document.getElementById("btnBad").addEventListener("click", () => grade(false));
document.getElementById("btnShuffle").addEventListener("click", () => {
  state.sessionGood = 0; state.sessionBad = 0;
  buildDeck(); renderCard();
});
document.getElementById("btnReset").addEventListener("click", () => {
  const scope = hasGroups(state.cat) && state.group !== "__all__" ? state.group : CAT_LABELS[state.cat];
  if(!confirm("Resetovat uložený postup pro \"" + scope + "\"?")) return;
  const items = DATA[state.cat];
  items.forEach((it, i) => {
    if(state.group === "__all__" || it[2] === state.group){
      delete progress[cardKey(state.cat, i)];
    }
  });
  saveProgress(progress);
  state.sessionGood = 0; state.sessionBad = 0;
  buildDeck(); renderCard();
});
document.getElementById("onlyHard").addEventListener("change", () => {
  state.sessionGood = 0; state.sessionBad = 0;
  buildDeck(); renderCard();
});
document.addEventListener("keydown", e => {
  if(e.code === "Space"){ e.preventDefault(); flip(); }
  else if(e.code === "ArrowRight" && state.flipped){ grade(true); }
  else if(e.code === "ArrowLeft" && state.flipped){ grade(false); }
});

drawMeterTicks();
setCategory(state.cat);

if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    drawMeterTicks();
    updateMeter();
  });
}
